name: CodeQL
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '19 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    uses: Oxiom-Systems/voiceover-video-starter/.github/workflows/ci-codeql-recipe.yml@b3a96b7461127bbdd55006f6a7cc7e16daa7e824
    with:
      # Root flips this literal only after canaries and managed-default retirement.
      upload_results: false
